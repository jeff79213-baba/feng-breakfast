<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f7a5a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>風自然早餐生產規劃</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🍳</text></svg>">
</head>
<body>

<section id="view-auth" class="view" hidden>
  <div class="login-card">
    <h1 class="login-title">風自然早餐生產規劃</h1>
    <p class="login-sub">輸入主帳號發給你的帳號與密碼</p>
    <label class="field">
      <span class="field-label">帳號</span>
      <input id="accountInput" type="text" inputmode="latin" autocomplete="username" placeholder="wind">
    </label>
    <label class="field">
      <span class="field-label">密碼</span>
      <span class="pw-wrap">
        <input id="passwordInput" type="password" autocomplete="current-password" placeholder="請輸入密碼">
        <button id="pwToggle" type="button" class="pw-toggle" aria-label="顯示密碼">顯示</button>
      </span>
    </label>
    <button id="accountBtn" class="btn btn-primary btn-block" type="button">登入</button>
    <div class="divider">或</div>
    <button id="googleBtn" class="btn btn-google btn-block" type="button">
      <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.2.5 24 .5 14.6.5 6.5 5.9 2.6 13.8l7.8 6.1C12.3 13.7 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-2.8-.4-4.1H24v8.4h12.7c-.3 2.1-1.6 5.2-4.6 7.3l7.6 5.9c4.5-4.2 6.8-10.3 6.8-17.5z"/><path fill="#FBBC05" d="M10.4 28.1c-.5-1.5-.8-3-.8-4.6s.3-3.1.8-4.6l-7.8-6.1C1 16 0 19.9 0 23.5s1 7.5 2.6 10.7l7.8-6.1z"/><path fill="#34A853" d="M24 47c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2 1.4-4.7 2.4-8.3 2.4-6.3 0-11.7-4.2-13.6-9.9l-7.8 6.1C6.5 42 14.6 47 24 47z"/></svg>
      <span>使用 Google 登入</span>
    </button>
    <p class="hint">只有已被加入名單的帳號可以登入。若無法登入，請聯絡主帳號把你加入名單。</p>
    <p id="authError" class="error" hidden></p>
  </div>
</section>

<section id="view-denied" class="view" hidden>
  <div class="login-card">
    <h1 class="login-title">還不能使用</h1>
    <p class="login-sub" id="deniedEmail"></p>
    <p class="hint">這個帳號不在名單內。請主帳號在「設定 → 人員管理」把你加入，加入後點「重新檢查」即可。</p>
    <button id="deniedRetryBtn" class="btn btn-primary btn-block" type="button">重新檢查</button>
    <button id="deniedOutBtn" class="btn btn-ghost btn-block" type="button">登出並換帳號</button>
  </div>
</section>

<section id="view-calendar" class="view" hidden>
  <header class="topbar">
    <button class="topbar-btn" data-go="settings" type="button">設定</button>
    <h1 class="topbar-title">早餐生產規劃</h1>
    <button class="topbar-btn" data-go="logout" type="button">登出</button>
  </header>
  <div class="cal-nav">
    <button id="calPrev" class="btn btn-ghost" type="button">‹</button>
    <span id="calLabel" class="cal-label"></span>
    <button id="calNext" class="btn btn-ghost" type="button">›</button>
  </div>
  <div class="cal-today">
    <button id="calToday" class="btn btn-ghost" type="button">回到今天</button>
  </div>
  <div class="cal-weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
  <div id="calGrid" class="cal-grid"></div>
</section>

<section id="view-day" class="view" hidden>
  <header class="topbar">
    <button class="topbar-btn" data-go="calendar" type="button">‹ 月曆</button>
    <h1 id="dayTitle" class="topbar-title"></h1>
    <button id="exportBtn" class="topbar-btn" type="button">匯出</button>
    <button class="topbar-btn" data-go="settings" type="button">設定</button>
  </header>
  <div id="dayStrip" class="day-strip"></div>
  <div id="dayBody" class="day-body"></div>
</section>

<section id="view-check" class="view" hidden>
  <header class="topbar">
    <button class="topbar-btn" data-go="back-day" type="button">‹ 返回</button>
    <h1 id="checkTitle" class="topbar-title"></h1>
    <button class="topbar-btn" data-go="settings" type="button">設定</button>
  </header>
  <div id="checkBody" class="check-body"></div>
  <footer class="check-footer">
    <button id="checkDone" class="btn btn-primary btn-block" type="button">完成</button>
  </footer>
</section>

<section id="view-settings" class="view" hidden>
  <header class="topbar">
    <button class="topbar-btn" data-go="back-from-settings" type="button">‹ 返回</button>
    <h1 class="topbar-title">設定</h1>
    <button class="topbar-btn" data-go="logout" type="button">登出</button>
  </header>
  <div id="settingsBody" class="settings-body"></div>
</section>

<script type="module">
  import { mountAuth } from './ui/auth.js';
  import { mountCalendar } from './ui/calendar.js';
  import { mountDay } from './ui/day.js';
  import { mountCheck } from './ui/check.js';
  import { mountPrep } from './ui/prep.js';
  import { mountSettings } from './ui/settings.js';
  import { mountExport } from './ui/export.js';
  mountAuth();
  mountCalendar();
  mountDay();
  mountCheck();
  mountPrep();
  mountSettings();
  mountExport();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function (e) {
        console.warn('SW 註冊失敗', e);
      });
    });
  }
</script>
</body>
</html>
